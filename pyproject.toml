[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "difm-radio"
version = "0.1.8"
description = "Home Assistant custom integration for DI.FM and sister radio services"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "HADI.fm contributors" }]

[project.optional-dependencies]
test = [
    "aiohttp>=3.9",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

# This repo is a Home Assistant custom integration, not a PyPI package.
# Disable auto-discovery so setuptools does not try to ship brand/, frontend/,
# or custom_components/ when CI runs ``pip install -e ".[test]"``.
[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
